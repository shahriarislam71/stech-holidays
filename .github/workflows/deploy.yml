name: 🚀 Build, Push & Deploy to VPS (Hardened)

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE_NAME: stech-holidays-backend
  FRONTEND_IMAGE_NAME: stech-holidays-frontend

  VPS_HOST: 72.62.79.113
  VPS_PORT: 2222
  VPS_USER: abdullah
  VPS_PROJECT_ROOT: /opt/stech-holidays
  VPS_COMPOSE_DIR: /opt/stech-holidays/compose
  VPS_ENV_FILE: /opt/stech-holidays/compose/.env

jobs:
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate-tag.outputs.tag }}

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: 🏷️ Generate Docker image tag
        id: generate-tag
        run: |
          TAG=${GITHUB_SHA:0:8}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📝 Generated tag: $TAG"

      # ✅ HARDENING: remove cache-from/cache-to to prevent poisoned layer reuse
      - name: 🐳 Build and push backend image (no cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          # ✅ HARDENING: do NOT push :latest (keeps behavior stable, avoids silent reinfection)
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.generate-tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # Build locally first (load), scan it, then push.
      # This blocks malware BEFORE it ever hits Docker Hub.
      - name: 🧱 Build frontend image locally (load, no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.stechholidays.com' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://stechholidays.com' }}
          # ✅ HARDENING: no cache reuse
          no-cache: true

      # ✅ HARDENING: scan the built image for known malware/crypto miners
      - name: 🔍 Scan frontend image (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # ✅ Only push if scan passes
      - name: 🐳 Push frontend image (after scan)
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}

  deploy-vps:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: success()

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p ${{ env.VPS_PORT }} ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "🔑 SSH key saved. Testing connection..."
          ssh -i ~/.ssh/deploy_key \
              -p ${{ env.VPS_PORT }} \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no \
              ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
              "echo '✅ SSH connection successful' && docker compose version"

      - name: 📤 Create deployment script (hardened pull)
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          echo "========================================"
          echo "🚀 DEPLOYING TO VPS"
          echo "========================================"
          echo "Project: stech-holidays"
          echo "New Tag: $IMAGE_TAG"
          echo "Env file: $VPS_ENV_FILE"
          echo ""

          cd $VPS_COMPOSE_DIR

          echo "0️⃣ Safety cleanup (remove any dead miner leftovers)..."
          # If any old infected containers/images still exist, remove them safely
          docker ps -aq --filter "name=frontend" | xargs -r docker rm -f || true
          docker ps -aq --filter "name=stech_frontend" | xargs -r docker rm -f || true

          echo "1️⃣ Pulling new Docker images..."
          echo "📥 Pulling backend: $BACKEND_IMAGE_FULL"
          docker pull $BACKEND_IMAGE_FULL

          echo "📥 Pulling frontend: $FRONTEND_IMAGE_FULL"
          docker pull $FRONTEND_IMAGE_FULL

          echo "✅ Images pulled successfully"

          echo ""
          echo "2️⃣ Updating .env file with new image tags..."
          if [ ! -f "$VPS_ENV_FILE" ]; then
            echo "❌ ERROR: .env file not found at $VPS_ENV_FILE"
            exit 1
          fi

          cp $VPS_ENV_FILE $VPS_ENV_FILE.backup.$(date +%Y%m%d_%H%M%S)

          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKEND_IMAGE_FULL|" $VPS_ENV_FILE
          sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTEND_IMAGE_FULL|" $VPS_ENV_FILE

          echo "✅ .env file updated"
          echo "New backend image: $BACKEND_IMAGE_FULL"
          echo "New frontend image: $FRONTEND_IMAGE_FULL"

          echo ""
          echo "3️⃣ Restarting services with new images..."
          docker compose down

          # ✅ HARDENING: make sure compose pulls exactly what .env points to
          docker compose pull

          docker compose up -d

          echo "✅ Services restarted"

          echo ""
          echo "4️⃣ Verifying deployment..."
          sleep 10

          docker compose ps

          echo ""
          echo "🌐 Testing services..."
          if curl -fsS http://localhost:8000 >/dev/null; then
            echo "✅ Backend is responding"
          else
            echo "❌ Backend may not be running"
          fi

          if curl -fsS http://localhost:3000 >/dev/null; then
            echo "✅ Frontend is responding"
          else
            echo "❌ Frontend may not be running"
          fi

          echo ""
          echo "📝 Checking recent logs..."
          echo "Backend logs (last 5 lines):"
          docker compose logs backend --tail 5 2>/dev/null || true

          echo ""
          echo "Frontend logs (last 5 lines):"
          docker compose logs frontend --tail 5 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY!"
          echo "========================================"
          echo "• Backend: $BACKEND_IMAGE_FULL"
          echo "• Frontend: $FRONTEND_IMAGE_FULL"
          echo "• Updated: $VPS_ENV_FILE"
          echo "• Commit: $COMMIT_SHA"
          echo "• Time: $(date)"
          echo ""
          echo "🔍 Current .env image settings:"
          grep "^BACKEND_IMAGE\|^FRONTEND_IMAGE" $VPS_ENV_FILE || true
          echo "========================================"
          EOF

          chmod +x deploy.sh
          echo "✅ Deployment script created"

      - name: 📤 Copy deployment script to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
              -P ${{ env.VPS_PORT }} \
              -o StrictHostKeyChecking=no \
              deploy.sh \
              ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/deploy.sh

      - name: ⚡ Execute deployment on VPS
        env:
          BACKEND_IMAGE_FULL: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          FRONTEND_IMAGE_FULL: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
          VPS_COMPOSE_DIR: ${{ env.VPS_COMPOSE_DIR }}
          VPS_ENV_FILE: ${{ env.VPS_ENV_FILE }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ env.VPS_PORT }} \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
              "BACKEND_IMAGE_FULL='$BACKEND_IMAGE_FULL' \
               FRONTEND_IMAGE_FULL='$FRONTEND_IMAGE_FULL' \
               IMAGE_TAG='$IMAGE_TAG' \
               COMMIT_SHA='$COMMIT_SHA' \
               VPS_COMPOSE_DIR='$VPS_COMPOSE_DIR' \
               VPS_ENV_FILE='$VPS_ENV_FILE' \
               bash /tmp/deploy.sh"
