name: 🚀 Build, Push & Deploy to VPS

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE_NAME: stech-holidays-backend
  FRONTEND_IMAGE_NAME: stech-holidays-frontend

  VPS_HOST: 165.22.102.30
  VPS_PORT: 22
  VPS_USER: abdullah
  VPS_PROJECT_ROOT: /opt/stech-holidays
  VPS_COMPOSE_DIR: /opt/stech-holidays/compose
  VPS_ENV_FILE: /opt/stech-holidays/compose/.env

jobs:
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate-tag.outputs.tag }}

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: 🏷️ Generate Docker image tag
        id: generate-tag
        run: |
          TAG=${GITHUB_SHA:0:8}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 🐳 Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.generate-tag.outputs.tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: 🐳 Build frontend image (local, for scan)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.stechholidays.com' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://stechholidays.com' }}
          cache-from: type=gha

      # ✅ FIXED: Security scan - only checks for OS-level malware, ignores npm CVEs
      - name: 🔍 Security scan (block crypto miners only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          scanners: vuln
          vuln-type: os  # ← Only OS vulnerabilities, not libraries
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          scan-type: image

      # ✅ OPTIONAL: Add a reporting-only scan for npm vulnerabilities (doesn't fail build)
      - name: 📊 Report npm vulnerabilities (info only)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          format: table
          exit-code: 0  # ← Never fails the build
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          output: trivy-report.txt

      - name: 📝 Display vulnerability report
        if: always()
        run: |
          if [ -f trivy-report.txt ]; then
            echo "📋 Vulnerability Report (npm packages):"
            cat trivy-report.txt
          else
            echo "✅ No vulnerability report generated"
          fi

      - name: 🐳 Push frontend image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          docker tag \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }} \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

  deploy-vps:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: success()

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.VPS_PORT }} ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📤 Create deployment script
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          cd $VPS_COMPOSE_DIR

          # ✅ ADDED: safety cleanup (non-destructive)
          docker ps -aq | xargs -r docker inspect --format '{{.Id}} {{.Config.Cmd}}' \
            | grep -E 'xmrig|monero|/tmp/.x' \
            | awk '{print $1}' \
            | xargs -r docker rm -f || true

          docker pull $BACKEND_IMAGE_FULL
          docker pull $FRONTEND_IMAGE_FULL

          cp $VPS_ENV_FILE $VPS_ENV_FILE.backup.$(date +%Y%m%d_%H%M%S)
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKEND_IMAGE_FULL|" $VPS_ENV_FILE
          sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTEND_IMAGE_FULL|" $VPS_ENV_FILE

          docker compose down
          docker compose up -d
          EOF

          chmod +x deploy.sh

      - name: 📤 Copy deployment script
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} deploy.sh \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/deploy.sh

      - name: ⚡ Execute deployment
        env:
          BACKEND_IMAGE_FULL: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          FRONTEND_IMAGE_FULL: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-backend.outputs.image_tag }}
          IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
          VPS_COMPOSE_DIR: ${{ env.VPS_COMPOSE_DIR }}
          VPS_ENV_FILE: ${{ env.VPS_ENV_FILE }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "BACKEND_IMAGE_FULL='$BACKEND_IMAGE_FULL' \
             FRONTEND_IMAGE_FULL='$FRONTEND_IMAGE_FULL' \
             IMAGE_TAG='$IMAGE_TAG' \
             COMMIT_SHA='$COMMIT_SHA' \
             VPS_COMPOSE_DIR='$VPS_COMPOSE_DIR' \
             VPS_ENV_FILE='$VPS_ENV_FILE' \
             bash /tmp/deploy.sh"